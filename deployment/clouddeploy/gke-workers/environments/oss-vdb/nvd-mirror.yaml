apiVersion: batch/v1
kind: CronJob
metadata:
  name: nvd-mirror
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: nvd-mirror
            env:
            - name: GOOGLE_CLOUD_PROJECT
              value: oss-vdb
            - name: WORK_DIR
              value: /tmp
            - name: GCS_BUCKET
              value: cve-osv-conversion
            - name: GCS_PREFIX
              value: nvd
